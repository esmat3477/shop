<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <meta name="description" content="Hakeemi Grocery Store - Fresh groceries delivered from Anaba District, Panjshir Province, Afghanistan">
    <title>Hakeemi Grocery Store</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Nunito+Sans:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Rubik', 'Noto Sans Arabic', 'system-ui', 'sans-serif'],
                        body: ['Nunito Sans', 'Noto Sans Arabic', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        cream: { 50: '#FFFBEB', 100: '#FEF3C7', 200: '#FDE68A' },
                        brand: {
                            green: '#059669',
                            'green-light': '#10B981',
                            amber: '#D97706',
                            'amber-light': '#F59E0B',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        * { box-sizing: border-box; }

        :root {
            --color-primary: #059669;
            --color-primary-light: #10B981;
            --color-accent: #D97706;
            --color-accent-light: #F59E0B;
            --color-bg: #FEFCE8;
            --color-card: #FFFFFF;
            --color-text: #1C1917;
            --color-text-muted: #78716C;
            --color-border: #E7E5E4;
            --color-warm-shadow: rgba(120, 113, 108, 0.12);
            --radius-card: 20px;
            --radius-button: 14px;
            --radius-badge: 12px;
            --font-heading: 'Rubik', 'Noto Sans Arabic', system-ui, sans-serif;
            --font-body: 'Nunito Sans', 'Noto Sans Arabic', system-ui, sans-serif;
        }

        body {
            font-family: var(--font-body);
            color: var(--color-text);
            background-image: linear-gradient(rgba(254, 252, 232, 0.85), rgba(254, 252, 232, 0.95)), url('assets/img/panjshir-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-heading { font-family: var(--font-heading); }

        /* Scrollbar hide */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Line clamp */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Warm card shadow */
        .card-shadow {
            box-shadow: 0 2px 8px var(--color-warm-shadow), 0 1px 3px rgba(120, 113, 108, 0.06);
        }
        .card-shadow-hover {
            box-shadow: 0 8px 24px rgba(120, 113, 108, 0.16), 0 2px 6px rgba(120, 113, 108, 0.08);
        }

        /* Product card hover */
        .product-card {
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        box-shadow 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .product-card:hover {
            transform: translateY(-3px);
        }
        .product-card:hover .product-image {
            transform: scale(1.03);
        }

        /* Product image */
        .product-image {
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Price badge pulse on hover */
        .price-badge {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover .price-badge {
            transform: scale(1.05);
        }

        /* Order button */
        .order-btn {
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .order-btn:active {
            transform: scale(0.97);
        }
        .order-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }
        .order-btn:hover::after {
            transform: translateX(100%);
        }

        /* Modal overlay */
        .modal-overlay {
            background: rgba(28, 25, 23, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* Modal enter animation */
        .modal-content {
            animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalSlideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Focus states - warm amber */
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--color-accent) !important;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15) !important;
        }

        /* Header accent strip */
        .header-strip {
            height: 3px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-accent), var(--color-primary));
        }

        /* Language dropdown */
        .lang-option {
            transition: background-color 0.15s ease;
        }
        .lang-option:hover {
            background-color: #FEF3C7;
        }
        .lang-option.active {
            background-color: #ECFDF5;
        }

        /* Offline banner */
        .offline-banner {
            background: linear-gradient(90deg, #D97706, #F59E0B);
        }

        /* Footer subtle pattern */
        .footer-pattern {
            background-color: #292524;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Smooth page load */
        .fade-in {
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Empty state illustration */
        .empty-illustration {
            opacity: 0.6;
        }

        /* WhatsApp icon bounce on card hover */
        .product-card:hover .wa-icon {
            animation: gentleBounce 0.4s ease;
        }
        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }
    </style>
</head>
<body class="antialiased">
<div id="app">
    <!-- Loading state -->
    <div class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4" style="background-color: var(--color-primary);">
                <svg class="w-7 h-7 text-white animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            </div>
            <p class="text-stone-500 font-medium font-heading text-sm">Loading...</p>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ===================== i18n =====================
    const I18N = {
        fa: {
            dir: 'rtl', lang: 'fa',
            labels: {
                appName: 'فروشگاه مواد غذایی حکیمی', shopName: 'فروشگاه مواد غذایی حکیمی',
                offline: 'شما آفلاین هستید — محصولات ذخیره شده نمایش داده می‌شوند.',
                noResults: 'محصولی یافت نشد',
                noProducts: 'هنوز محصولی اضافه نشده',
                noProductsDesc: 'محصولات پس از اضافه شدن توسط فروشنده در اینجا نمایش داده می‌شوند.',
                orderWhatsApp: 'سفارش از طریق واتس‌اپ',
                orderTitle: 'ثبت سفارش شما', customerName: 'نام شما',
                customerPhone: 'شماره تلفن (اختیاری)', customerNotes: 'درخواست خاصی دارید؟',
                placeOrder: 'ارسال سفارش', nameRequired: 'لطفاً نام خود را وارد کنید',
                phoneInvalid: 'لطفاً شماره تلفن معتبر وارد کنید', cancel: 'لغو', close: 'بستن',
                adminTitle: 'پنل مدیریت', priceAFN: 'افغانی',
                langDari: 'دری', langPashto: 'پښتو',
                currencyAFN: 'افغانی',
                tagline: 'مواد غذایی تازه از پنجشیر',
                footerLocation: 'ولسوالی اناب، پنجشیر',
                footerMadeWith: 'ساخته شده با',
                footerForCommunity: 'برای جامعه ما',
                quantity: 'مقدار',
                unitKg: 'کیلوگرام', unitLiter: 'لیتر', unitPiece: 'عدد',
                perKg: 'فی کیلو', perLiter: 'فی لیتر', perPiece: 'فی عدد',
            }
        },
        ps: {
            dir: 'rtl', lang: 'ps',
            labels: {
                appName: 'د حکیمي خوراکه فروشۍ', shopName: 'د حکیمي خوراکه فروشۍ',
                offline: 'تاسو آفلاین یاست — کچې محصولات ښکاره کېدلی.',
                noResults: 'هیچ محصول نه موندل شوه',
                noProducts: 'هیڅ محصول اضافه نه شوی',
                noProductsDesc: 'محصولات به دلته ښکاره شي کله چې فروشنده یې اضافه کړي.',
                orderWhatsApp: 'د واتس‌اپ له لارې سفارش',
                orderTitle: 'ستاسو سفارش ثبت کول', customerName: 'ستاسو نوم',
                customerPhone: 'تلیفون نومر (اختیاري)', customerNotes: 'خاص غوښتنې لرئ؟',
                placeOrder: 'سفارش ولېږئ', nameRequired: 'مهرباني وکړئ خپل نوم ولیکئ',
                phoneInvalid: 'مهرباني وکړئ معتبر تلیفون نومر ولیکئ', cancel: 'لغو کول', close: 'بند کول',
                adminTitle: 'مدیریت', priceAFN: 'افغانی',
                langDari: 'دری', langPashto: 'پښتو',
                currencyAFN: 'افغانی',
                tagline: 'د پنجشیر تازه خوراکي توکي',
                footerLocation: 'د اناب ولسوالۍ، پنجشیر',
                footerMadeWith: 'جوړ شوی د',
                footerForCommunity: 'سره زموږ ټولنې لپاره',
                quantity: 'مقدار',
                unitKg: 'کیلوګرام', unitLiter: 'لیتر', unitPiece: 'دانه',
                perKg: 'فی کیلو', perLiter: 'فی لیتر', perPiece: 'فی دانه',
            }
        }
    };

    let currentLang = localStorage.getItem('grocery_lang');
    if (currentLang === 'en' || !currentLang) currentLang = 'fa';

    function t(key) {
        const labels = I18N[currentLang]?.labels || I18N.fa.labels;
        return labels[key] || I18N.fa.labels[key] || key;
    }

    function applyLanguage(lang) {
        if (!I18N[lang]) lang = 'fa';
        currentLang = lang;
        document.documentElement.setAttribute('dir', I18N[lang].dir);
        document.documentElement.setAttribute('lang', lang);
        localStorage.setItem('grocery_lang', lang);
        renderApp();
    }

    function formatPrice(amount) {
        const num = Number(amount).toLocaleString('en-US');
        return num + ' ' + t('priceAFN');
    }

    // ===================== Store =====================
    const DEFAULT_SETTINGS = {
        shopName: { en: 'Hakeemi Grocery Store', fa: 'فروشگاه مواد غذایی حکیمی', ps: 'د حکیمي خوراکه فروشۍ' },
        whatsappNumber: '93791897790',
        defaultLanguage: 'fa',
        currencySymbol: 'AFN',
        orderMessageTemplate: '🛒 *New Order from {{shopName}}*\n\n📦 *Order Details:*\n{{items}}\n\n💰 *Total: {{total}} {{currency}}*\n📍 *Delivery: Anaba District, Panjshir*\n📞 *Customer: {{customerName}}*\n📱 *Phone: {{customerPhone}}*\n\n_Order placed via {{shopName}}_'
    };

    const DEFAULT_PRODUCTS = [
        { id: 'prod_1', name: { fa: 'آرد گندم ممتاز' }, price: 45, image: null, visible: true },
        { id: 'prod_2', name: { fa: 'روغن آفتابگردان' }, price: 136, image: null, visible: true },
        { id: 'prod_3', name: { fa: 'لوبیا قرمز' }, price: 320, image: null, visible: true },
        { id: 'prod_4', name: { fa: 'برنج بسمتی' }, price: 120, image: null, visible: true },
        { id: 'prod_5', name: { fa: 'شکر قندی' }, price: 95, image: null, visible: true },
        { id: 'prod_6', name: { fa: 'چای سبز' }, price: 280, image: null, visible: true },
        { id: 'prod_7', name: { fa: 'نخود' }, price: 140, image: null, visible: true },
        { id: 'prod_8', name: { fa: 'عدس سفید' }, price: 180, image: null, visible: true },
    ];

    function get(key, def) {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
    }
    function set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) { console.error(e); } }

    function initStore() {
        if (!localStorage.getItem('grocery_products')) set('grocery_products', DEFAULT_PRODUCTS);
        if (!localStorage.getItem('grocery_orders')) set('grocery_orders', []);
        if (!localStorage.getItem('grocery_settings')) set('grocery_settings', DEFAULT_SETTINGS);
    }

    function getVisibleProducts() { return (get('grocery_products', [])).filter(function(p) { return p.visible !== false; }); }
    function getShopName(lang) { var s = get('grocery_settings', DEFAULT_SETTINGS); return (s.shopName && s.shopName[lang]) || s.shopName?.en || 'Hakeemi Grocery Store'; }
    function getWhatsAppNumber() { return get('grocery_settings', DEFAULT_SETTINGS).whatsappNumber || '93791897790'; }
    function getOrderTemplate() { return get('grocery_settings', DEFAULT_SETTINGS).orderMessageTemplate || DEFAULT_SETTINGS.orderMessageTemplate; }
    function saveOrder(order) { var orders = get('grocery_orders', []); orders.unshift(order); set('grocery_orders', orders); }

    // ===================== WhatsApp =====================
    function buildOrderMessage(order) {
        var shopName = getShopName(currentLang);
        var itemsText = order.items.map(function(item, i) {
            var name = item.name.fa || item.name || '';
            return (i + 1) + '. ' + name + ' (' + item.weight + ' kg) = ' + formatPrice(item.price * item.weight);
        }).join('\n');
        var tpl = getOrderTemplate();
        return tpl.replace(/\{\{shopName\}\}/g, shopName)
            .replace(/\{\{items\}\}/g, itemsText)
            .replace(/\{\{total\}\}/g, formatPrice(order.total))
            .replace(/\{\{currency\}\}/g, 'AFN')
            .replace(/\{\{customerName\}\}/g, order.customerName || '')
            .replace(/\{\{customerPhone\}\}/g, order.customerPhone || 'N/A');
    }

    function openWhatsApp(order) {
        var phone = getWhatsAppNumber().replace(/\D/g, '');
        var msg = buildOrderMessage(order);
        var url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
        window.open(url, '_blank', 'noopener,noreferrer');
    }

    function validatePhone(phone) {
        if (!phone) return true;
        return /^93[0-9]{9}$/.test(phone.replace(/\D/g, ''));
    }

    // ===================== App State =====================
    var selectedProduct = null;
    var placeholderSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23FEF3C7'/%3E%3Cg transform='translate(100,85)' fill='none' stroke='%23D97706' stroke-width='1.5' opacity='0.5'%3E%3Ccircle r='28'/%3E%3Cpath d='M-12-8h24v16c0 6-4 10-12 10s-12-4-12-10z'/%3E%3Cpath d='M-8-8c0-6 3-10 8-10s8 4 8 10'/%3E%3C/g%3E%3Crect x='50' y='140' width='100' height='5' rx='2.5' fill='%23D97706' opacity='0.15'/%3E%3Crect x='65' y='152' width='70' height='5' rx='2.5' fill='%23D97706' opacity='0.1'/%3E%3C/svg%3E";

    // ===================== Render =====================
    function renderApp() {
        var lang = currentLang;
        var products = getVisibleProducts();
        var shopName = getShopName(lang);
        var isRTL = I18N[lang].dir === 'rtl';
        document.title = shopName;

        var langButtons = [
            { code: 'fa', label: 'دری', flag: '🇦🇫' },
            { code: 'ps', label: 'پښتو', flag: '🇦🇫' }
        ];

        // Language selector in header
        var langSelectorHTML = '<div class="relative">' +
            '<button id="lang-toggle" class="flex items-center gap-2 px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 transition-colors text-sm font-medium text-stone-700" aria-label="Language">' +
            '<svg class="w-4 h-4 text-stone-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>' +
            '<span>' + langButtons.find(function(b) { return b.code === lang; }).flag + ' ' + lang.toUpperCase() + '</span>' +
            '<svg class="w-3 h-3 text-stone-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>' +
            '</button>' +
            '<div id="lang-dropdown" class="hidden absolute top-full mt-2 ' + (isRTL ? 'left-0' : 'right-0') + ' bg-white rounded-2xl card-shadow border border-stone-100 overflow-hidden min-w-[170px] z-50">' +
            langButtons.map(function(o) {
                var isActive = lang === o.code;
                return '<button data-lang="' + o.code + '" class="lang-option w-full px-4 py-3 flex items-center gap-3 ' + (isActive ? 'active' : '') + '">' +
                    '<span class="text-base">' + o.flag + '</span>' +
                    '<span class="text-sm font-medium ' + (isActive ? 'text-emerald-700' : 'text-stone-700') + '">' + o.label + '</span>' +
                    (isActive ? '<svg class="w-4 h-4 text-emerald-500 ' + (isRTL ? 'mr-auto' : 'ml-auto') + '" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>' : '') +
                    '</button>';
            }).join('') +
            '</div></div>';

        // Product cards
        var productCards = products.length > 0 ? products.map(function(product) {
            var name = product.name.fa || product.name || 'Product';
            var u = product.unit || 'kg';
            var uCap = u.charAt(0).toUpperCase() + u.slice(1);
            var price = formatPrice(product.price) + ' / ' + (t('per' + uCap) || t('perKg'));
            var img = product.image || placeholderSvg;
            return '<div class="product-card bg-white rounded-[20px] card-shadow overflow-hidden border border-stone-100 hover:card-shadow-hover">' +
                '<div class="relative overflow-hidden bg-amber-50" style="padding-top:85%;">' +
                '<img src="' + img + '" alt="' + name + '" loading="lazy" decoding="async" class="product-image absolute inset-0 w-full h-full object-cover" onerror="this.src=\'' + placeholderSvg + '\'">' +
                '<div class="price-badge absolute top-3 ' + (isRTL ? 'left-3' : 'right-3') + ' bg-amber-500 text-white px-3 py-1.5 rounded-xl text-sm font-bold font-heading shadow-sm">' + price + '</div>' +
                '</div>' +
                '<div class="p-4 pt-3">' +
                '<h3 class="font-heading font-semibold text-stone-800 text-[15px] leading-snug mb-3 line-clamp-2 min-h-[2.5rem]">' + name + '</h3>' +
                '<button class="order-btn w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-[14px] flex items-center justify-center gap-2 text-sm" data-id="' + product.id + '">' +
                '<svg class="wa-icon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>' +
                t('orderWhatsApp') + '</button></div></div>';
        }).join('') :
            '<div class="col-span-full text-center py-16 px-6">' +
            '<div class="empty-illustration w-20 h-20 rounded-full bg-amber-100 flex items-center justify-center mx-auto mb-5">' +

        document.getElementById('app').innerHTML =

            // Logo + shop name

            '<svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>' +
            '</div>' +
            '<div>' +
            '<h1 class="font-heading text-base sm:text-lg font-bold text-stone-800 leading-tight">' + shopName + '</h1>' +
            '<p class="text-xs text-stone-400 hidden sm:block">' + t('tagline') + '</p>' +
            '</div></div>' +

            // Header actions
            '<div class="flex items-center gap-2 sm:gap-3">' +
            langSelectorHTML +
            '<a href="admin.html" class="flex items-center gap-1.5 px-3 py-2 rounded-xl border border-stone-200 hover:bg-stone-50 transition-colors text-sm font-medium text-stone-600">' +
            '<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>' +
            '<span class="hidden sm:inline">' + t('adminTitle') + '</span></a>' +
            '</div></div></div></header>' +

            // Main content
            '<main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 pb-12">' +
            '<div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-5">' + productCards + '</div></main>' +

            // Order modal
            '<div id="order-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">' +
            '<div class="modal-content bg-white rounded-t-3xl sm:rounded-3xl card-shadow-hover w-full max-w-md max-h-[92vh] sm:max-h-[85vh] overflow-y-auto">' +

            // Modal header
            '<div class="sticky top-0 bg-white border-b border-stone-100 px-6 py-4 rounded-t-3xl sm:rounded-t-3xl flex items-center justify-between">' +
            '<h2 class="font-heading text-lg font-bold text-stone-800">' + t('orderTitle') + '</h2>' +
            '<button id="close-modal" class="w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 flex items-center justify-center transition-colors">' +
            '<svg class="w-5 h-5 text-stone-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>' +
            '</button></div>' +

            // Modal body
            '<div class="p-6">' +
            '<div id="order-product-info" class="bg-amber-50 rounded-2xl p-4 mb-6 border border-amber-100"></div>' +
            '<form id="order-form" class="space-y-4">' +

            // Name field
            '<div>' +
            '<label class="block text-sm font-semibold text-stone-700 mb-1.5">' + t('customerName') + ' <span class="text-amber-500">*</span></label>' +
            '<input type="text" id="customer-name" required class="w-full px-4 py-3 border-2 border-stone-200 rounded-2xl bg-stone-50 text-stone-800 placeholder-stone-400 text-sm" autocomplete="name">' +
            '</div>' +
            
            // Weight field
            '<div>' +
            '<label class="block text-sm font-semibold text-stone-700 mb-1.5" id="order-weight-label">' + t('quantity') + ' <span class="text-amber-500">*</span></label>' +
            '<input type="number" id="order-weight" min="1" step="0.5" value="1" required class="w-full px-4 py-3 border-2 border-stone-200 rounded-2xl bg-stone-50 text-stone-800 text-sm">' +
            '</div>' +

            // Phone field
            '<div>' +
            '<label class="block text-sm font-semibold text-stone-700 mb-1.5">' + t('customerPhone') + '</label>' +
            '<input type="tel" id="customer-phone" inputmode="numeric" class="w-full px-4 py-3 border-2 border-stone-200 rounded-2xl bg-stone-50 text-stone-800 placeholder-stone-400 text-sm" placeholder="0791897790" autocomplete="tel">' +
            '</div>' +

            // Notes field
            '<div>' +
            '<label class="block text-sm font-semibold text-stone-700 mb-1.5">' + t('customerNotes') + '</label>' +
            '<textarea id="customer-notes" rows="3" class="w-full px-4 py-3 border-2 border-stone-200 rounded-2xl bg-stone-50 text-stone-800 placeholder-stone-400 text-sm resize-none"></textarea>' +
            '</div>' +

            // Action buttons
            '<div class="flex gap-3 pt-3">' +
            '<button type="button" id="cancel-order" class="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-600 font-semibold py-3.5 px-4 rounded-2xl transition-colors text-sm">' + t('cancel') + '</button>' +
            '<button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-4 rounded-2xl transition-all flex items-center justify-center gap-2 text-sm">' +
            '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>' +
            t('placeOrder') + '</button></div></form></div></div></div>' +

            // Footer
            '<footer class="footer-pattern text-stone-300 py-8">' +
            '<div class="max-w-6xl mx-auto px-4 sm:px-6 text-center">' +
            '<div class="flex items-center justify-center gap-2 mb-3">' +
            '<div class="w-8 h-8 rounded-xl flex items-center justify-center" style="background-color: var(--color-primary);">' +
            '<svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>' +
            '</div>' +
            '<span class="font-heading font-semibold text-sm text-stone-400">' + shopName + '</span></div>' +
            '<p class="text-xs text-stone-500 mb-1">📍 ' + t('footerLocation') + '</p>' +
            '<p class="text-xs text-stone-600">' + t('footerMadeWith') + ' ❤️ ' + t('footerForCommunity') + '</p>' +
            '<p class="text-xs text-stone-600 mt-3">&copy; ' + new Date().getFullYear() + '</p>' +
            '</div></footer>' +

            '</div>';

        // Update offline banner
        var banner = document.getElementById('offline-banner');
        if (banner) banner.classList.toggle('hidden', navigator.onLine);
    }

    // ===================== Events =====================
    document.addEventListener('click', function(e) {
        // Language toggle
        if (e.target.closest('#lang-toggle')) {
            e.stopPropagation();
            document.getElementById('lang-dropdown').classList.toggle('hidden');
            return;
        }

        // Close dropdown when clicking elsewhere
        var dropdown = document.getElementById('lang-dropdown');
        if (dropdown && !e.target.closest('#lang-dropdown')) {
            dropdown.classList.add('hidden');
        }

        // Language selection
        var langBtn = e.target.closest('[data-lang]');
        if (langBtn) {
            applyLanguage(langBtn.getAttribute('data-lang'));
            return;
        }

        // Order button
        var orderBtn = e.target.closest('.order-btn');
        if (orderBtn) {
            var productId = orderBtn.getAttribute('data-id');
            var products = getVisibleProducts();
            var product = products.find(function(p) { return p.id === productId; });
            if (product) openOrderModal(product);
            return;
        }

        // Close modal
        if (e.target.closest('#close-modal') || e.target.closest('#cancel-order')) {
            closeOrderModal();
            return;
        }
    });

    // Click outside modal
    document.addEventListener('click', function(e) {
        if (e.target && e.target.id === 'order-modal') closeOrderModal();
    });

    // Form submit
    document.addEventListener('submit', function(e) {
        if (e.target.id === 'order-form') {
            e.preventDefault();
            handleOrder();
        }
    });

    // Dynamic price calculation
    document.addEventListener('input', function(e) {
        if (e.target.id === 'order-weight') {
            var weight = parseFloat(e.target.value) || 1;
            var priceEl = document.getElementById('order-dynamic-price');
            if (priceEl) {
                var basePrice = parseFloat(priceEl.getAttribute('data-base-price')) || 0;
                priceEl.textContent = formatPrice(basePrice * weight);
            }
        }
    });

    function openOrderModal(product) {
        selectedProduct = product;
        var name = product.name.fa || product.name;
        var defaultWeight = product.weight || 1;
        var initialPrice = formatPrice(product.price * defaultWeight);
        var img = product.image || placeholderSvg;
        
        var u = product.unit || 'kg';
        var uCap = u.charAt(0).toUpperCase() + u.slice(1);
        var unitLabel = t('unit' + uCap) || t('unitKg');

        document.getElementById('order-product-info').innerHTML =
            '<div class="flex items-center gap-4">' +
            '<img src="' + img + '" alt="' + name + '" class="w-14 h-14 rounded-xl object-cover bg-amber-100 flex-shrink-0" onerror="this.src=\'' + placeholderSvg + '\'">' +
            '<div class="min-w-0">' +
            '<h3 class="font-heading font-semibold text-stone-800 text-sm leading-snug">' + name + '</h3>' +
            '<p id="order-dynamic-price" class="text-amber-600 font-bold font-heading text-sm mt-0.5" data-base-price="' + product.price + '">' + initialPrice + '</p>' +
            '</div></div>';

        var weightInput = document.getElementById('order-weight');
        if (weightInput) weightInput.value = defaultWeight;
        
        var weightLabel = document.getElementById('order-weight-label');
        if (weightLabel) weightLabel.innerHTML = t('quantity') + ' (' + unitLabel + ') <span class="text-amber-500">*</span>';

        document.getElementById('order-modal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        setTimeout(function() {
            document.getElementById('customer-name').focus();
        }, 100);
    }

    function closeOrderModal() {
        document.getElementById('order-modal').classList.add('hidden');
        document.body.style.overflow = '';
        selectedProduct = null;
        document.getElementById('order-form').reset();
    }

    function handleOrder() {
        if (!selectedProduct) return;
        var name = document.getElementById('customer-name').value.trim();
        var phone = document.getElementById('customer-phone').value.trim();
        var notes = document.getElementById('customer-notes').value.trim();

        if (!name) { alert(t('nameRequired')); return; }
        if (phone && !validatePhone(phone)) { alert(t('phoneInvalid')); return; }

        var weight = parseFloat(document.getElementById('order-weight').value) || 1;

        var order = {
            id: 'order_' + Date.now(),
            items: [{ id: selectedProduct.id, name: selectedProduct.name, price: selectedProduct.price, quantity: 1, weight: weight, unit: selectedProduct.unit || 'kg' }],
            total: selectedProduct.price * weight,
            customerName: name,
            customerPhone: phone,
            customerNotes: notes,
            status: 'pending',
            createdAt: Date.now()
        };

        saveOrder(order);
        openWhatsApp(order);
        closeOrderModal();
    }

    // Offline detection
    window.addEventListener('online', function() {
        var b = document.getElementById('offline-banner');
        if (b) b.classList.add('hidden');
    });
    window.addEventListener('offline', function() {
        var b = document.getElementById('offline-banner');
        if (b) b.classList.remove('hidden');
    });

    // ===================== Init =====================
    initStore();
    renderApp();

    // Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('sw.js').catch(function() {});
        });
    }
})();
</script>

</html>
