                orderDate: 'تاریخ', orderCustomer: 'مشتری', orderTotal: 'مجموع', orderStatus: 'وضعیت',
                statusPending: 'در انتظار', statusConfirmed: 'تأیید شده', statusDelivered: 'تحویل شده', statusCancelled: 'لغو شده',
                shopSettings: 'تنظیمات فروشگاه', shopNameEn: 'نام فروشگاه (انگلیسی)', shopNameFa: 'نام فروشگاه (دری)',

                changePin: 'تغییر رمز', currentPin: 'رمز فعلی', newPin: 'رمز جدید', confirmNewPin: 'تأیید رمز جدید',

                productNameFa: 'نوم (دری)', productNamePs: 'نوم (پښتو)', productPrice: 'قیمت (افغانی)',
                productImage: 'د محصول انځور', uploadImage: 'انځور اپ لوډ', removeImage: 'انځور وا نیول',
                productVisible: 'د کاتالوګ کې ښکاره', saving: 'ساتل کیږي...', productSaved: 'محصول ساتل شو',

                orderDate: 'نیته', orderCustomer: 'ست编者', orderTotal: 'ټول', orderStatus: 'סטатוס',
                statusPending: 'چېکات', statusConfirmed: 'تایید', statusDelivered: 'ورسول', statusCancelled: 'منسوخ',
                shopSettings: 'د دوکان تنظیمات', shopNameEn: 'د دوکان نوم (انګلیسي)', shopNameFa: 'د دوکان نوم (دری)',
                shopNamePs: 'د دوکان نوم (پښتو)', whatsappNumber: 'واتس‌اپ نومر',
                whatsappNumberHint: 'فورمټ: 937xxxxxxxxx', defaultLanguage: 'د ژبه پیش‌فرض',
                changePin: 'PIN بدل', currentPin: 'اوسنی PIN', newPin: 'نوی PIN', confirmNewPin: 'نوی PIN تایید',
                pinChanged: 'PIN بدل شو', currentPinWrong: 'اوسنی PIN ناکام',
                exportData: 'داتا برونtákول', importData: 'داتا درونtákول', importSuccess: 'داتا درونtákل شو', importError: 'فایل نامعتبر',
                save: 'ساتل', cancel: 'لغو', yes: 'هو', no: 'نه',
                currencyAFN: 'افغانی', priceAFN: 'افغانی'
            }
        }
    };

    var currentLang = localStorage.getItem('grocery_lang') || 'fa';
    function t(key) { var l = I18N[currentLang]?.labels || I18N.fa.labels; return l[key] || I18N.en.labels[key] || key; }
    function formatPrice(a) { var n = Number(a).toLocaleString('en-US'); return currentLang === 'en' ? t('priceAFN') + ' ' + n : n + ' ' + t('priceAFN'); }
    function formatDate(d) { return new Date(d).toLocaleDateString(currentLang === 'fa' ? 'fa-AF' : currentLang === 'ps' ? 'ps-AF' : 'en-US', { year: 'numeric', month: 'short', day: 'numeric' }); }

    // ===================== Store =====================
    var DEFAULT_SETTINGS = {
        shopName: { en: 'Hakeemi Grocery Store', fa: 'فروشگاه مواد غذایی حکیمی', ps: 'د حکیمي خوراکه فروشۍ' },
        whatsappNumber: '93791897790', defaultLanguage: 'fa', currencySymbol: 'AFN',
        orderMessageTemplate: '🛒 *New Order from {{shopName}}*\n\n📦 *Order Details:*\n{{items}}\n\n💰 *Total: {{total}} {{currency}}*\n📍 *Delivery: Anaba District, Panjshir*\n📞 *Customer: {{customerName}}*\n📱 *Phone: {{customerPhone}}*\n\n_Order placed via {{shopName}}_'
    };

    function get(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
    function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) { console.error(e); } }
    function initStore() {
        if (!localStorage.getItem('grocery_products')) set('grocery_products', [
            { id: 'prod_1', name: { en: 'Premium Wheat Flour (10kg)', fa: 'آرد گندم ممتاز (۱۰ کیلو)', ps: 'لوی ګندم آرد (۱۰ کګ)' }, price: 450, image: null, visible: true },
            { id: 'prod_2', name: { en: 'Sunflower Oil (5L)', fa: 'روغن آفتابگردان (۵ لیتر)', ps: 'د لمری روغن (۵ لتر)' }, price: 680, image: null, visible: true },
            { id: 'prod_3', name: { en: 'Red Kidney Beans (1kg)', fa: 'لوبیا قرمز (۱ کیلو)', ps: 'سور لوبیا (۱ کګ)' }, price: 320, image: null, visible: true },
            { id: 'prod_4', name: { en: 'Basmati Rice (10kg)', fa: 'برنج بسمتی (۱۰ کیلو)', ps: 'بسمتي برنج (۱۰ کګ)' }, price: 1200, image: null, visible: true },
            { id: 'prod_5', name: { en: 'Granulated Sugar (1kg)', fa: 'شکر قندی (۱ کیلو)', ps: 'شکر (۱ کګ)' }, price: 95, image: null, visible: true },
            { id: 'prod_6', name: { en: 'Green Tea Box (250g)', fa: 'چای سبز جعبه‌دار (۲۵۰ گرم)', ps: 'سبز چای بکس (۲۵۰ ګرام)' }, price: 280, image: null, visible: true },
        ]);
        if (!localStorage.getItem('grocery_orders')) set('grocery_orders', []);
        if (!localStorage.getItem('grocery_settings')) set('grocery_settings', DEFAULT_SETTINGS);
    }

    function getProducts() { return get('grocery_products', []); }
    function getOrders() { return (get('grocery_orders', [])).sort(function(a, b) { return b.createdAt - a.createdAt; }); }
    function getSettings() { return get('grocery_settings', DEFAULT_SETTINGS); }
    function getShopName(lang) { var s = getSettings(); return (s.shopName && s.shopName[lang]) || s.shopName?.en || 'Hakeemi Grocery Store'; }
    function saveProduct(p) { var ps = getProducts(); var idx = ps.findIndex(function(x) { return x.id === p.id; }); if (idx >= 0) ps[idx] = p; else ps.push(p); set('grocery_products', ps); }
    function deleteProduct(id) { set('grocery_products', getProducts().filter(function(p) { return p.id !== id; })); }
    function toggleVisibility(id) { var ps = getProducts(); var p = ps.find(function(x) { return x.id === id; }); if (p) { p.visible = !p.visible; set('grocery_products', ps); } }
    function saveOrder(o) { var orders = getOrders(); orders.unshift(o); set('grocery_orders', orders); }
    function updateOrderStatus(id, st) { var orders = getOrders(); var o = orders.find(function(x) { return x.id === id; }); if (o) { o.status = st; set('grocery_orders', orders); } }
    function saveSettings(s) { set('grocery_settings', Object.assign(getSettings(), s)); }
    function exportData() { return { products: getProducts(), orders: getOrders(), settings: getSettings(), exportedAt: Date.now(), version: '1.0' }; }
    function importData(d) { if (d.products) set('grocery_products', d.products); if (d.orders) set('grocery_orders', d.orders); if (d.settings) set('grocery_settings', d.settings); }
    function clearAll() { ['grocery_products', 'grocery_orders', 'grocery_settings', 'grocery_pin_hash', 'grocery_pin_salt', 'grocery_pin_attempts', 'grocery_pin_lockout'].forEach(function(k) { localStorage.removeItem(k); }); initStore(); }
    function getStats() {
        var orders = getOrders(), now = Date.now(), day = 86400000;
        var todayStart = new Date(); todayStart.setHours(0,0,0,0);
        var weekStart = new Date(); weekStart.setDate(weekStart.getDate() - weekStart.getDay()); weekStart.setHours(0,0,0,0);
        var monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
        var todayOrders = orders.filter(function(o) { return o.createdAt >= todayStart.getTime(); });
        var weekOrders = orders.filter(function(o) { return o.createdAt >= weekStart.getTime(); });
        var monthOrders = orders.filter(function(o) { return o.createdAt >= monthStart.getTime(); });
        var sum = function(arr) { return arr.reduce(function(s, o) { return s + (o.total || 0); }, 0); };
        var prodSales = {};
        orders.forEach(function(o) { (o.items || []).forEach(function(item) {
            if (!prodSales[item.id]) prodSales[item.id] = { id: item.id, name: item.name, count: 0, revenue: 0 };
            prodSales[item.id].count += (item.quantity || 1);
            prodSales[item.id].revenue += (item.price || 0) * (item.quantity || 1);
        }); });
        var topProducts = Object.values(prodSales).sort(function(a, b) { return b.count - a.count; }).slice(0, 5);
        return { totalOrders: orders.length, todayRevenue: sum(todayOrders), weekRevenue: sum(weekOrders), monthRevenue: sum(monthOrders),
            todayCount: todayOrders.length, weekCount: weekOrders.length, monthCount: monthOrders.length, topProducts: topProducts };
    }

    // ===================== Auth =====================
    var MAX_ATTEMPTS = 5;
    function isPinSet() { return !!localStorage.getItem('grocery_pin_hash'); }
    function isLocked() { var l = parseInt(localStorage.getItem('grocery_pin_lockout') || '0'); if (l && Date.now() < l) return true; if (l) { localStorage.removeItem('grocery_pin_lockout'); localStorage.removeItem('grocery_pin_attempts'); } return false; }
    function getRemainingMinutes() { var l = parseInt(localStorage.getItem('grocery_pin_lockout') || '0'); return l && Date.now() < l ? Math.ceil((l - Date.now()) / 60000) : 0; }
    async function hashPin(pin, salt) { var enc = new TextEncoder(); var data = enc.encode(pin + salt); var buf = await crypto.subtle.digest('SHA-256', data); return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join(''); }
    function genSalt() { var a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, function(b) { return b.toString(16).padStart(2, '0'); }).join(''); }
    async function setPin(pin) { var salt = genSalt(); localStorage.setItem('grocery_pin_hash', await hashPin(pin, salt)); localStorage.setItem('grocery_pin_salt', salt); localStorage.removeItem('grocery_pin_attempts'); localStorage.removeItem('grocery_pin_lockout'); }
    async function verifyPin(pin) {
        if (isLocked()) throw new Error('locked:' + getRemainingMinutes());
        var hash = localStorage.getItem('grocery_pin_hash'), salt = localStorage.getItem('grocery_pin_salt');
        if (!hash || !salt) throw new Error('not_set');
        if (await hashPin(pin, salt) === hash) { localStorage.removeItem('grocery_pin_attempts'); sessionStorage.setItem('admin_session', 'true'); return true; }
        var att = parseInt(localStorage.getItem('grocery_pin_attempts') || '0') + 1;
        localStorage.setItem('grocery_pin_attempts', att.toString());
        if (att >= MAX_ATTEMPTS) localStorage.setItem('grocery_pin_lockout', (Date.now() + 300000).toString());
        throw new Error('invalid:' + Math.max(0, MAX_ATTEMPTS - att));
    }
    function checkSession() { return sessionStorage.getItem('admin_session') === 'true'; }
    function logout() { sessionStorage.removeItem('admin_session'); }

    // ===================== App State =====================
    var currentTab = 'dashboard';
    var editingProduct = null;
    var isAdmin = false;

    // ===================== Init =====================
    initStore();
    if (checkSession()) { isAdmin = true; renderDashboard(); } else { renderLogin(); }

    // ===================== Login =====================
    function renderLogin() {
        var pinExists = isPinSet();
        var locked = isLocked();
        var pinLabel = currentLang === 'fa' ? 'رمز عبور (PIN)' : currentLang === 'ps' ? 'رمز (PIN)' : 'Password (PIN)';
        var confirmLabel = currentLang === 'fa' ? 'تکرار رمز' : currentLang === 'ps' ? 'تکرار رمز' : 'Confirm Password';
        var hint = currentLang === 'fa' ? 'رمز را با اعداد انگلیسی وارد کنید (۴ تا ۶ رقم)' :
                   currentLang === 'ps' ? 'رمز په انګلیسي شمېرو ورکړئ (۴ تا ۶ رقم)' : 'Enter 4-6 digits (English numbers)';
        var setupHint = currentLang === 'fa' ? 'برای اولین بار یک رمز ۴ تا ۶ رقمی انتخاب کنید و آن را به خاطر بسپارید' :
                        currentLang === 'ps' ? 'لومړی ځل ۴ تا ۶ رقمی رمز غوره کړئ او هغه یاد ورکړئ' : 'Choose a 4-6 digit PIN you will remember';
        var loginHint = currentLang === 'fa' ? 'برای ورود به پنل مدیریت، رمز خود را وارد کنید' :
                        currentLang === 'ps' ? 'د پنل ته د داخلیدو لپاره خپله PIN ورکړئ' : 'Enter your PIN to access the admin dashboard';

        document.getElementById('app').innerHTML =
            '<div class="min-h-screen bg-gradient-to-br from-emerald-50 via-green-50 to-teal-50 flex items-center justify-center p-4">' +
            '<div class="w-full max-w-md">' +
            // Logo and title
            '<div class="bg-white rounded-2xl shadow-xl p-6 md:p-8">' +
            '<div class="text-center mb-6">' +
            '<div class="w-20 h-20 bg-gradient-to-br from-emerald-500 to-green-600 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-lg">' +
            '<svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></div>' +
            '<h1 class="text-2xl font-bold text-gray-800">' + (pinExists ? t('enterPinTitle') : t('setPinTitle')) + '</h1>' +
            '<p class="text-gray-500 mt-2 text-sm">' + (pinExists ? loginHint : setupHint) + '</p></div>' +
            // Status badge
            '<div class="text-center mb-6">' +
            '<span class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium ' + (pinExists ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700') + '">' +
            '<span class="w-2 h-2 rounded-full ' + (pinExists ? 'bg-blue-500' : 'bg-amber-500') + '"></span>' +
            (pinExists ? (currentLang === 'fa' ? 'ورود به پنل' : currentLang === 'ps' ? 'د پنل ته ننوتل' : 'Login to Panel') :

    function showLoginError(msg) {
        var el = document.getElementById('pin-error');
        if (el) { el.textContent = msg; el.classList.remove('hidden'); }
        // Shake animation on PIN input
        var input = document.getElementById('pin-input');
        if (input) { input.classList.add('border-red-400', 'animate-pulse'); input.value = ''; input.focus(); setTimeout(function() { input.classList.remove('border-red-400', 'animate-pulse'); }, 1500); }
    }

    async function handlePinSubmit(e) {
        e.preventDefault();
        var pin = document.getElementById('pin-input').value.replace(/[^0-9]/g, '');
        if (!pin || pin.length < 4 || pin.length > 6) { showLoginError(t('pinTooShort')); return; }
        try {
            if (!isPinSet()) {
                var confirm = (document.getElementById('pin-confirm')?.value || '').replace(/[^0-9]/g, '');
                if (pin !== confirm) { showLoginError(t('pinMismatch')); return; }
                await setPin(pin);
                sessionStorage.setItem('admin_session', 'true');
                isAdmin = true; renderDashboard();
            } else {
                await verifyPin(pin);
                isAdmin = true; renderDashboard();
            }
        } catch(err) {
            var msg = err.message;
            if (msg.startsWith('locked:')) { showLoginError(t('pinLocked')); renderLogin(); }
            else if (msg.startsWith('invalid:')) showLoginError(t('pinInvalid') + ' — ' + msg.split(':')[1]);
            else showLoginError(t('pinInvalid'));
        }
    }

    function handleResetPin() {
        if (confirm(t('resetConfirm'))) {
            var newPin = prompt(t('setPinDesc'));
            if (newPin && newPin.length >= 4 && newPin.length <= 6) {
                clearAll();
                setPin(newPin).then(function() { sessionStorage.setItem('admin_session', 'true'); isAdmin = true; renderDashboard(); });
            }
        }
    }

        document.getElementById('modal-title').textContent = p ? t('editProduct') : t('addProduct');
        document.getElementById('p-id').value = p?.id || 'prod_' + Date.now();
        document.getElementById('p-name-en').value = p?.name?.en || '';
        document.getElementById('p-name-fa').value = p?.name?.fa || '';
        document.getElementById('p-name-ps').value = p?.name?.ps || '';
        document.getElementById('p-price').value = p?.price || '';
        document.getElementById('p-visible').checked = p ? p.visible !== false : true;
        currentProductImage = p?.image || '';
        if (p?.image) { document.getElementById('img-preview').classList.remove('hidden'); document.getElementById('preview-img').src = p.image; }
        else { document.getElementById('img-preview').classList.add('hidden'); }
        document.getElementById('product-modal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }
    function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); document.body.style.overflow = ''; editingProduct = null; currentProductImage = ''; }

    function handleImageUpload(e) {
        var file = e.target.files?.[0]; if (!file || !file.type.startsWith('image/')) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            var img = new Image();
            img.onload = function() {
                var canvas = document.createElement('canvas'); var max = 600;
                var w = img.width, h = img.height;
                if (w > h && w > max) { h = h * max / w; w = max; } else if (h > max) { w = w * max / h; h = max; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                currentProductImage = canvas.toDataURL('image/jpeg', 0.7);
                document.getElementById('preview-img').src = currentProductImage;
                document.getElementById('img-preview').classList.remove('hidden');
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }

    function handleProductSave(e) {
        e.preventDefault();
        var p = {
            id: document.getElementById('p-id').value,
            name: { en: document.getElementById('p-name-en').value.trim(), fa: document.getElementById('p-name-fa').value.trim(), ps: document.getElementById('p-name-ps').value.trim() },
            price: parseInt(document.getElementById('p-price').value, 10),
            image: currentProductImage || null,
            visible: document.getElementById('p-visible').checked
        };
        saveProduct(p); closeProductModal(); renderTab();
    }

    // ===================== Orders Tab =====================
    function renderOrdersTab() {
        var orders = getOrders();
        var lang = currentLang;
        if (orders.length === 0) return '<div class="bg-white rounded-xl p-8 border border-gray-200 text-center"><h3 class="text-lg font-semibold text-gray-600">' + t('noOrders') + '</h3></div>';
        var rows = orders.map(function(o) {
            var stCols = { pending: 'bg-yellow-100 text-yellow-700', confirmed: 'bg-blue-100 text-blue-700', delivered: 'bg-green-100 text-green-700', cancelled: 'bg-red-100 text-red-700' };
            var itemNames = (o.items || []).map(function(i) { return i.name?.[lang] || i.name?.en || ''; }).join(', ');
            return '<tr class="hover:bg-gray-50">' +
                '<td class="px-4 py-3 text-sm text-gray-600">' + formatDate(o.createdAt) + '</td>' +
                '<td class="px-4 py-3"><p class="text-sm font-medium text-gray-800">' + (o.customerName || 'N/A') + '</p><p class="text-xs text-gray-500">' + (o.customerPhone || '') + '</p></td>' +
                '<td class="px-4 py-3"><p class="text-sm text-gray-600">' + (o.items?.length || 0) + ' items</p><p class="text-xs text-gray-500 truncate max-w-[150px]">' + itemNames + '</p></td>' +
                '<td class="px-4 py-3 text-sm font-semibold text-emerald-600">' + formatPrice(o.total) + '</td>' +
                '<td class="px-4 py-3"><span class="text-xs px-2 py-1 rounded-full ' + (stCols[o.status] || 'bg-gray-100') + '">' + t('status' + o.status.charAt(0).toUpperCase() + o.status.slice(1)) + '</span></td>' +
                '<td class="px-4 py-3"><select class="status-sel text-xs border border-gray-300 rounded-lg px-2 py-1" data-id="' + o.id + '">' +
                ['pending','confirmed','delivered','cancelled'].map(function(s) { return '<option value="' + s + '"' + (o.status === s ? ' selected' : '') + '>' + t('status' + s.charAt(0).toUpperCase() + s.slice(1)) + '</option>'; }).join('') +
                '</select></td></tr>';
        }).join('');
        return '<div class="space-y-6"><h2 class="text-xl font-bold text-gray-800">' + t('orders') + '</h2>' +
            '<div class="bg-white rounded-xl border border-gray-200 overflow-hidden"><div class="overflow-x-auto"><table class="w-full"><thead class="bg-gray-50 border-b border-gray-200"><tr>' +
            '<th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">' + t('orderDate') + '</th>' +
            '<th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">' + t('orderCustomer') + '</th>' +
            '<th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">Items</th>' +
            '<th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">' + t('orderTotal') + '</th>' +
            '<th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">' + t('orderStatus') + '</th>' +
            '<th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">Action</th>' +
            '</tr></thead><tbody class="divide-y divide-gray-100">' + rows + '</tbody></table></div></div></div>';
    }

    function attachOrderEvents() {
        document.querySelectorAll('.status-sel').forEach(function(sel) {
            sel.addEventListener('change', function() { updateOrderStatus(sel.getAttribute('data-id'), sel.value); renderTab(); });
        });
    }

    // ===================== Settings Tab =====================
    function renderSettingsTab() {
        var s = getSettings();
        return '<div class="space-y-6"><h2 class="text-xl font-bold text-gray-800">' + t('settings') + '</h2>' +
            '<div class="bg-white rounded-xl p-6 border border-gray-200"><h3 class="font-semibold text-gray-800 mb-4">' + t('shopSettings') + '</h3>' +
            '<form id="settings-form" class="space-y-4">' +
            '<div><label class="block text-sm font-medium text-gray-700 mb-1">' + t('shopNameEn') + '</label><input type="text" id="s-name-en" value="' + (s.shopName?.en || '') + '" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500"></div>' +
            '<div class="grid grid-cols-2 gap-4">' +
            '<div><label class="block text-sm font-medium text-gray-700 mb-1">' + t('shopNameFa') + '</label><input type="text" id="s-name-fa" value="' + (s.shopName?.fa || '') + '" dir="rtl" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500"></div>' +
            '<div><label class="block text-sm font-medium text-gray-700 mb-1">' + t('shopNamePs') + '</label><input type="text" id="s-name-ps" value="' + (s.shopName?.ps || '') + '" dir="rtl" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500"></div></div>' +
            '<div><label class="block text-sm font-medium text-gray-700 mb-1">' + t('whatsappNumber') + '</label><input type="text" id="s-whatsapp" value="' + (s.whatsappNumber || '') + '" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500" placeholder="' + t('whatsappNumberHint') + '"></div>' +
            '<div><label class="block text-sm font-medium text-gray-700 mb-1">' + t('defaultLanguage') + '</label>' +
            '<select id="s-lang" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500">' +
            '<option value="en"' + (s.defaultLanguage === 'en' ? ' selected' : '') + '>English</option>' +
            '<option value="fa"' + (s.defaultLanguage === 'fa' ? ' selected' : '') + '>Dari (دری)</option>' +
            '<option value="ps"' + (s.defaultLanguage === 'ps' ? ' selected' : '') + '>Pashto (پښتو)</option></select></div>' +
            '<button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 px-4 rounded-xl">' + t('save') + '</button></form></div>' +
            // Change PIN
            '<div class="bg-white rounded-xl p-6 border border-gray-200"><h3 class="font-semibold text-gray-800 mb-4">' + t('changePin') + '</h3>' +
            '<form id="pin-form" class="space-y-4">' +
            '<div><label class="block text-sm font-medium text-gray-700 mb-1">' + t('currentPin') + '</label><input type="password" id="cp-current" maxlength="6" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500"></div>' +
            '<div><label class="block text-sm font-medium text-gray-700 mb-1">' + t('newPin') + '</label><input type="password" id="cp-new" maxlength="6" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500"></div>' +
            '<div><label class="block text-sm font-medium text-gray-700 mb-1">' + t('confirmNewPin') + '</label><input type="password" id="cp-confirm" maxlength="6" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500"></div>' +
            '<div id="pin-err" class="hidden text-red-500 text-sm"></div>' +
            '<button type="submit" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3 px-4 rounded-xl">' + t('changePin') + '</button></form></div>' +
            // Data management
            '<div class="bg-white rounded-xl p-6 border border-gray-200"><h3 class="font-semibold text-gray-800 mb-4">Data Management</h3>' +
            '<div class="flex gap-4">' +
            '<button id="export-btn" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2">' +
            '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>' + t('exportData') + '</button>' +
            '<label class="flex-1 bg-purple-500 hover:bg-purple-600 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 cursor-pointer">' +
            '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>' + t('importData') +
            '<input type="file" id="import-file" accept=".json" class="hidden"></label></div></div></div>';
    }

    function attachSettingsEvents() {
        document.getElementById('settings-form')?.addEventListener('submit', function(e) {
            e.preventDefault();
            saveSettings({
                shopName: { en: document.getElementById('s-name-en').value.trim(), fa: document.getElementById('s-name-fa').value.trim(), ps: document.getElementById('s-name-ps').value.trim() },
                whatsappNumber: document.getElementById('s-whatsapp').value.trim(),
                defaultLanguage: document.getElementById('s-lang').value
            });
            alert(t('productSaved'));
        });
        document.getElementById('pin-form')?.addEventListener('submit', async function(e) {
            e.preventDefault();
            var cur = document.getElementById('cp-current').value;
            var nw = document.getElementById('cp-new').value;
            var cf = document.getElementById('cp-confirm').value;
            var err = document.getElementById('pin-err');
            if (nw !== cf) { err.textContent = t('pinMismatch'); err.classList.remove('hidden'); return; }
            if (nw.length < 4 || nw.length > 6) { err.textContent = t('pinTooShort'); err.classList.remove('hidden'); return; }
            try {
                await verifyPin(cur);
                await setPin(nw);
                alert(t('pinChanged'));
                document.getElementById('pin-form').reset();
                err.classList.add('hidden');
            } catch(e2) {
                err.textContent = e2.message.includes('invalid') || e2.message.includes('locked') ? t('currentPinWrong') : t('pinInvalid');
                err.classList.remove('hidden');
            }
        });
        document.getElementById('export-btn')?.addEventListener('click', function() {
            var data = exportData();
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a'); a.href = url; a.download = 'hakeemi-backup-' + new Date().toISOString().split('T')[0] + '.json'; a.click();
            URL.revokeObjectURL(url);
        });
        document.getElementById('import-file')?.addEventListener('change', function(e) {
            var file = e.target.files?.[0]; if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                try { var data = JSON.parse(ev.target.result); importData(data); alert(t('importSuccess')); renderTab(); }
                catch { alert(t('importError')); }
            };
            reader.readAsText(file);
        });
    }

})();
</script>
